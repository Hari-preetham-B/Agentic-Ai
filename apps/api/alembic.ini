# CareerTwin Alembic configuration

[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone =

# max length of characters to apply to the
# "version" file name
# version_name_template = %(year)d_%(month)d_%(day)d_%(hour)d%(minute)d%(second)d_%(slug)s
version_name_template = %(slug)s

# The set of tables written to the _alembic_version table
# version_table = alembic_version

# The schema to use for the version table
# version_table_schema =

# Temporarily disable version table checks
# skip = False

# The starting version for the database
# base_version =

# SQLAlchemy URL
# This is overridden at runtime by the DATABASE_URL environment variable.
sqlalchemy.url =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated migration scripts. See the documentation for further detail and
# examples
# post_write_hooks = script

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
