[project]
name = "api"
version = "0.1.0"
description = "CareerTwin backend — FastAPI foundation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.29,<2.1",
    "asyncpg>=0.32.0,<0.33.0",
    "alembic>=1.13,<2",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9,<0.0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
